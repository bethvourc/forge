[package]
name = "forge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Forge: a terminal-native DevOps command center"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5.0"
futures = "0.3"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

